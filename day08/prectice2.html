<!DOCTYPE html>
<html lang="ko-KR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>prectice2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
  <main class="container p-5">

    <section class="bg-white rounded-4 p-4 p-md-5">

      <div class="row align-items-center g-5">

        <div class="col-12 col-lg-7">
          <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
            <span class="badge  text-bg-success">신정가능</span>
            <small class="text-secondary fw-bolder">Frontend Studt #03</small>
          </div>    
          <h1 class="fw-bold">Bootstrap 실전 스터디</h1>
          <p class="text-secondary fw-bolder"> Bootstrap의 Grid, Utility, Component를 활용해 반응형 웹 UI를 함께 제작하는 오프라인 스터디입니다.</p>

          <div class="list-group list-group-flush border-top border-bottom mb-3">
            <div class="list-group-item py-3 d-flex justify-content-between align-items-center">
              <small class="text-secondary">일정</small>
              <strong>9월 12일 토요일 · 14:00</strong>
            </div>
            <div class="list-group-item py-3 d-flex justify-content-between align-items-center">
              <small class="text-secondary">장소</small>
              <strong>강남 스터디룸 A</strong>
            </div>
            <div class="list-group-item py-3 d-flex justify-content-between align-items-center">
              <small class="text-secondary">진행시간</small>
              <strong>약 2시간</strong>
            </div>
          </div>

          <div class="d-flex flex-wrap gap-3">
            <span class="badge rounded-pill text-bg-light border px-3 py-2">Grid</span>
            <span class="badge rounded-pill text-bg-light border px-3 py-2">Utility</span>
            <span class="badge rounded-pill text-bg-light border px-3 py-2">Responsive</span>
          </div>
        </div>
        
        <div class="col-12 col-lg-5 bg-light rounded-4 p-4 ">
          <div class="d-flex flex-column justify-content-center gap-3">
            <p class="text-secondary fw-bolder mb-0"><i class="bi bi-person-fill"></i> 현재 신청 인원</p>

            <div class="d-flex justify-content-between align-items-end">
              <strong class="fw-bold display-6">18명</strong>
              <span class="text-secondary">/ 24명</span>
            </div>

            <div
              class="progress mb-2"
              role="progressbar"
              aria-label="스터디 신청 현황"
              aria-valuenow="75"
              aria-valuemin="0"
              aria-valuemax="100"
            >
              <div class="progress-bar" style="width: 75%">75%</div>
            </div>

            <div class="alert alert-warning">남은 자리가 많지 않습니다.</div>

            <a href="#" class="btn btn-dark btn-lg w-100" role="button">스터디 참가 신청</a>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
