<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>profileCard</title>

    <link rel="stylesheet" href="./dist/output.css" />
  </head>

  <body>
    <main class="p-6 bg-black">
      <header class="flex flex-col gap-3 mb-3">
        <p
          class="text-red-500 font-semibold text-xl tracking-[.25em] uppercase"
        >
          Tailwind CSS · Practice 01
        </p>

        <h1 class="text-white font-bold text-5xl">
          Movie Card
        </h1>

        <p class="text-gray-400 text-lg">
          이미지, 오버레이, absolute positioning, group-hover,
          transition을 활용해 스트리밍 서비스 스타일의 콘텐츠 카드를
          만들어봅니다.
        </p>
      </header>

      <section>
        <article
          class="
            group 
            relative
            aspect-4/5
            max-w-sm
            overflow-hidden
            rounded-2xl
            bg-zinc-900
          "
        >
          <img
            src="./assets/img.jpg"
            alt="창문틀에 화분이 햇빛에 빛쳐진다."
            class="
              absolute
              inset-0
              h-hull
              w-full
              group-hover:scale-110
              transition
              duration-700
              ease-out
            "
          />

          <div
            class="
              absolute
              inset-0
              w-full
              h-full
              bg-gray-900/60

            "
          ></div>

          <div class="absolute top-3 left-3 flex gap-2">
            <span
              class="
                inline-flex
                items-center
                rounded-md
                bg-red-600
                px-2
                py-1
                text-xs
                font-mediu
                text-white
                inset-rin
                inset-ring-red-600/10
                font-bold
              "
            >
              TOP 10
            </span>

            <span
              class="
                inline-flex
                items-center
                rounded-md
                bg-black
                px-2
                py-1
                text-xs
                font-mediu
                text-white
                font-bold
              "
            >
              15+
            </span>
          </div>

          <button
            type="button"
            aria-label="재생"
            class="
              flex
              items-center
              justify-center
              bg-white
              w-12
              h-12
              rounded-full
              absolute
              top-1/2
              left-1/2
              -translate-x-1/2
              -translate-y-1/2
              opacity-0
              group-hover:opacity-100
              transition
            "
          >
            ▶
          </button>

          <div
            class="
              absolute
              bottom-0
              left-0
              p-4
              flex
              flex-col
              gap-2
              transla
            "
          >
            <p class="text-red-400 font-bold">
              Original Series
            </p>

            <h2 class="text-white font-bold text-4xl">
              NIGHTFALL
            </h2>

            <div class="flex gap-2">
              <span class="text-green-400">
                98% 일치
              </span>

              <span class="text-white">
                2026
              </span>

              <span
                class="
                  inline-flex
                  items-center
                  rounded-md
                  bg-gray-900
                  px-2
                  py-1
                  text-xs
                  font-medium
                  text-white
                  inset-ring
                  inset-ring-gray-500/10
                  border
                "
              >
                HD
              </span>
            </div>

            <p class="text-white">
              모든 빛이 사라진 도시에서 마지막 신호를 따라가는 세 사람의 미스터리 스릴러.
            </p>

            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">
              <button
                type="button"
                class="
                bg-gray-200
                w-75
                rounded-full  
                "
              >
                ▶ 재생
              </button>

              <button
                type="button"
                aria-label="내가 찜한 콘텐츠에 추가"
                class="
                  flex
                  items-center
                  justify-center
                  rounded-full
                  bg-black
                  text-white
                  font-bold
                  border
                  w-7
                  h-7
                  "
              >
                +
              </button>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
